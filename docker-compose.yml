version: '3.8'

services:
  # Backend: Python FastAPI + WebSocket server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc-simulator-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount code for development (hot reload)
      - ./backend:/app
      - /app/__pycache__
    restart: unless-stopped
    networks:
      - soc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Frontend: React app served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-simulator-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - soc-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  soc-network:
    driver: bridge

volumes:
  backend-data:
